<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Final</title>
    <style>
      .hero {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 8%;

        background: linear-gradient(135deg, #060022, #120038, #1f0057);

        color: white;
      }

      .hero-content {
        flex: 1;
        max-width: 500px;
      }

      .hero-image {
        flex: 1;

        display: flex;
        justify-content: center;
      }

      .hero-image img {
        width: 100%;
        max-width: 600px;
      }

      .hero h1 {
        font-size: 4rem;
        line-height: 1.1;
      }

      .hero-buttons {
        display: flex;
        gap: 1rem;
        margin-top: 2rem;
      }
      .features,
      .about {
        padding: 100px 8%;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-content">
        <h4>Artificial Intelligence</h4>
        <h1>DEEP LEARNING SYSTEM</h1>

        <div class="hero-buttons">
          <a href="#" class="btn primary">Get Started</a>
          <a href="#" class="btn secondary">Learn More</a>
        </div>
      </div>

      <div class="hero-image">
        <img src="head-graphic.png" alt="" />
      </div>
    </section>
  </body>
</html>
